    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        
        :root {
            --bg-blue: #0A3D91; 
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --ludo-blue: #2196F3;
            --ludo-red: #F44336;
            --ludo-yellow: #FFEB3B;
            --ludo-green: #4CAF50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg-blue); background-image: radial-gradient(circle at center, #1565C0 0%, #0A3D91 100%); color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        .glass-header { background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 50; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #FFD700; object-fit: cover; }
        .balance-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-weight: 800; color: #FFD700; display: flex; align-items: center; gap: 5px; }

        .page { display: none; flex: 1; flex-direction: column; height: calc(100vh - 75px); overflow-y: auto; }
        .page.active { display: flex; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .home-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; gap: 20px; }
        .ludo-logo { max-width: 250px; margin-bottom: 20px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); animation: bounce 3s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; }
        .ludo-btn { background: linear-gradient(180deg, #FFD700, #F57C00); border: 2px solid #FFF; border-radius: 15px; padding: 15px 10px; color: #1D1D1F; font-weight: 800; font-size: 14px; text-transform: uppercase; text-align: center; cursor: pointer; box-shadow: 0 8px 0 #B35900, 0 15px 20px rgba(0,0,0,0.4); transition: 0.1s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ludo-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #B35900, 0 5px 10px rgba(0,0,0,0.4); }
        .ludo-btn i { font-size: 28px; color: #0A3D91; }

        .ad-container { width: 100%; height: 60px; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .ad-container.bottom { border-top: 1px solid rgba(255,255,255,0.2); border-bottom: none; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; position: relative; }
        .ludo-board-wrapper { width: 100%; max-width: 350px; aspect-ratio: 1; background: #fff; border: 4px solid #333; border-radius: 10px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 5px; margin-bottom: 10px; }
        .board-grid { display: grid; grid-template-columns: 6fr 3fr 6fr; grid-template-rows: 6fr 3fr 6fr; width: 100%; height: 100%; gap: 2px; background: #333; }
        
        .base { display: flex; justify-content: center; align-items: center; padding: 15%; }
        .base-inner { width: 100%; height: 100%; background: #fff; border-radius: 20%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; padding: 15px; }
        .pawn-spot { width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 3px 5px rgba(0,0,0,0.3); }
        
        .bg-blue { background-color: var(--ludo-blue); } .bg-red { background-color: var(--ludo-red); } .bg-yellow { background-color: var(--ludo-yellow); } .bg-green { background-color: var(--ludo-green); }
        .path-vertical { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(6, 1fr); gap: 1px; }
        .path-horizontal { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1px; }
        .cell { background: #fff; display: flex; justify-content: center; align-items: center; font-size: 10px; color: #ccc; }
        .cell.safe { font-size: 16px; color: #333; }
        .center-home { width: 100%; height: 100%; background: conic-gradient(var(--ludo-blue) 0deg 90deg, var(--ludo-red) 90deg 180deg, var(--ludo-green) 180deg 270deg, var(--ludo-yellow) 270deg 360deg); border: 1px solid #333; }

        .dice-container { display: flex; justify-content: space-around; width: 100%; max-width: 400px; align-items: center; margin-bottom: 10px; }
        .dice-box { width: 60px; height: 60px; background: #fff; border-radius: 12px; border: 3px solid #333; display: flex; justify-content: center; align-items: center; font-size: 35px; color: #1D1D1F; cursor: pointer; box-shadow: 0 8px 0 #ccc, 0 10px 15px rgba(0,0,0,0.3); transition: 0.1s; }
        .dice-box:active { transform: translateY(5px); box-shadow: 0 3px 0 #ccc, 0 5px 10px rgba(0,0,0,0.3); }
        .dice-anim { animation: spinDice 0.3s linear infinite; }
        @keyframes spinDice { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }

        /* Ban Screen */
        #ban-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1D1D1F; z-index: 9999; justify-content: center; align-items: center; flex-direction: column; padding: 20px; text-align: center; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .modal-card { background: #fff; width: 90%; max-width: 320px; border-radius: 20px; padding: 30px 20px; text-align: center; color: #1D1D1F; box-shadow: 0 15px 35px rgba(0,0,0,0.5); transform: scale(0.8); animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popUp { to { transform: scale(1); } }
        
        /* Winning Celebration Animation */
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; animation: fall 3s linear infinite; z-index: 1001; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        .trophy-glow { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)); font-size: 70px; margin-bottom: 15px; animation: bounce 2s infinite; }

    <!-- Celebration Win Modal -->
    <div id="win-modal" class="modal-overlay">

            <div style="background: rgba(245, 166, 35, 0.1); border: 1px solid #F5A623; border-radius: 15px; padding: 15px; margin-bottom: 20px;">
                <div style="font-size: 12px; color: #888; text-transform: uppercase; font-weight: 800;">Reward Earned</div>
                <div style="font-size: 32px; font-weight: 800; color: #1D1D1F;">+<span id="win-reward-amt">100</span> CP</div>
            </div>

            <!-- Changed button logic to trigger Ad before claiming -->
            <button id="claim-btn" onclick="watchAdToClaim()" style="width: 100%; background: linear-gradient(180deg, #FFD700, #F57C00); border: none; padding: 15px; border-radius: 20px; color: #1D1D1F; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 5px 15px rgba(245, 166, 35, 0.4);">Claim Reward</button>
        </div>

    <script src="https://adsgram.ai/js/adsgram.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB-XSDKkEDRs6q6SJoruZjwaI1725Kqo0U",
            authDomain: "crypto-pay-3ca70.firebaseapp.com",
            projectId: "crypto-pay-3ca70",
            storageBucket: "crypto-pay-3ca70.firebasestorage.app",
            messagingSenderId: "215480352569",
            appId: "1:215480352569:web:795d6068ec24d568df32e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let userId = tg.initDataUnsafe?.user?.id ? tg.initDataUnsafe.user.id.toString() : "demo_user";
        let userData = { cp: 0, isBanned: false }; 
        
        let gameStartTime = 0;
        let gameInterval = null;
        let gameEnded = false;
        
        let currentScore = 0;
        const WIN_TARGET = 50; 
        const ANTI_CHEAT_MIN_TIME_MS = 60000; 

        if(tg.initDataUnsafe?.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name || "Guest";
            if(tg.initDataUnsafe.user.photo_url) document.getElementById('user-avatar').src = tg.initDataUnsafe.user.photo_url;
        }

        async function fetchUserData() {
            if(userId !== "demo_user") {
                try {
                    const docSnap = await db.collection("users").doc(userId).get();
                    if (docSnap.exists) { 
                        userData = docSnap.data();
                        if (userData.isBanned === true) { showBanScreen(); return; }
                        document.getElementById('cp-balance').innerText = Math.floor(userData.cp || 0);
                    }
                } catch(e) {}
            }
        }
        fetchUserData();

        async function addCPToFirebase(amount) {
            userData.cp = (userData.cp || 0) + amount;
            document.getElementById('cp-balance').innerText = Math.floor(userData.cp);
            if(userId !== "demo_user") {
                await db.collection("users").doc(userId).set({ cp: firebase.firestore.FieldValue.increment(amount) }, {merge: true});
            }
        }

        function startGame() {
            document.getElementById('page-home').classList.remove('active');
            document.getElementById('page-game').classList.add('active');
            
            gameEnded = false;
            currentScore = 0;
            document.getElementById('game-score').innerText = currentScore;
            
            gameStartTime = Date.now();
            updateTimerUI();
            gameInterval = setInterval(updateTimerUI, 1000);
        }

        function goHome() {
            document.getElementById('page-game').classList.remove('active');
            document.getElementById('page-home').classList.add('active');
            clearInterval(gameInterval);
            document.getElementById('win-modal').style.display = 'none';
        }

        function updateTimerUI() {
            let elapsedSec = Math.floor((Date.now() - gameStartTime) / 1000);
            let m = Math.floor(elapsedSec / 60).toString().padStart(2, '0');
            let s = (elapsedSec % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function rollDice() {
            if(gameEnded) return;
            let diceBtn = document.getElementById('dice-btn');
            if(diceBtn.classList.contains('dice-anim')) return;
            
            diceBtn.classList.add('dice-anim');
            setTimeout(() => {
                diceBtn.classList.remove('dice-anim');
                let result = Math.floor(Math.random() * 6) + 1;
                const icons = ['one', 'two', 'three', 'four', 'five', 'six'];
                diceBtn.innerHTML = `<i class="fa-solid fa-dice-${icons[result-1]}" style="color:#F44336;"></i>`;
                tg.HapticFeedback.impactOccurred('light');
                
                currentScore += (result * 2); // Accelerate progress slightly
                if(currentScore > 100) currentScore = 100;
                document.getElementById('game-score').innerText = currentScore;

                if (currentScore >= WIN_TARGET) {
                    processWin();
                }
            }, 500);
        }

        function processWin() {
            gameEnded = true;
            clearInterval(gameInterval);
            let timePlayed = Date.now() - gameStartTime;

            if (timePlayed < ANTI_CHEAT_MIN_TIME_MS) {
                tg.HapticFeedback.notificationOccurred('error');
                banUser();
                return;
            }

            tg.HapticFeedback.notificationOccurred('success');
            createConfetti();
            let reward = Math.random() > 0.5 ? 100 : 50; 
            document.getElementById('win-reward-amt').innerText = reward;
            document.getElementById('win-modal').dataset.reward = reward;
            document.getElementById('win-modal').style.display = 'flex';
        }

        // NEW LOGIC: Watch Ad -> Give Coins -> Go Home
        function watchAdToClaim() {
            let btn = document.getElementById('claim-btn');
            btn.innerText = "Loading Ad...";
            let reward = parseInt(document.getElementById('win-modal').dataset.reward);

            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: "45228" });
                AdController.show().then(() => {
                    finalizeClaim(reward);
                }).catch(() => {
                    fallbackAdAndClaim(reward);
                });
            } else {
                fallbackAdAndClaim(reward);
            }
        }

        function fallbackAdAndClaim(reward) {
            window.open("https://omg10.com/4/11678700", "_blank");
            setTimeout(() => { finalizeClaim(reward); }, 1500);
        }

        function finalizeClaim(reward) {
            addCPToFirebase(reward);
            tg.HapticFeedback.notificationOccurred('success');
            goHome();
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = ['#f00', '#0f0', '#00f', '#ff0', '#f0f'][Math.floor(Math.random()*5)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4000);
            }
        }

        async function banUser() {
            if(userId !== "demo_user") {
                await db.collection("users").doc(userId).set({ isBanned: true }, {merge: true});
            }
            document.getElementById('ban-screen').style.display = 'flex';
        }
    </script>
</body>

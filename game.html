            board.appendChild(centerHome);

            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if ((r<6&&c<6) || (r<6&&c>=9) || (r>=9&&c<6) || (r>=9&&c>=9) || (r>=6&&r<9&&c>=6&&c<9)) continue;
                    const cell = document.createElement("div");
                    cell.className = "cell"; cell.style.gridColumn = `${c + 1}`; cell.style.gridRow = `${r + 1}`;
                    cell.dataset.row = r; cell.dataset.col = c;
                    if (r === 6 && c === 1) cell.classList.add("red-start");
                    else if (r === 1 && c === 8) cell.classList.add("green-start");
                    else if (r === 8 && c === 13) cell.classList.add("yellow-start");
                    else if (r === 13 && c === 6) cell.classList.add("blue-start");
                    
                    const index = TRACK_COORDS.findIndex(coord => coord[0] === r && coord[1] === c);
                    if (index !== -1 && SAFE_CELLS.has(index)) cell.classList.add("safe-star");
                    COLORS.forEach(color => { if (HOME_CORRIDORS[color].some(coord => coord[0] === r && coord[1] === c)) cell.classList.add(`${color.toLowerCase()}-path`); });
                    board.appendChild(cell);
                }
            }
        }
        function createBaseElement(board, color, rowStart, rowEnd, colStart, colEnd) {
            const base = document.createElement("div"); base.className = `base base-${color.toLowerCase()}`;
            base.style.gridColumn = `${colStart} / ${colEnd}`; base.style.gridRow = `${rowStart} / ${rowEnd}`;
            const inner = document.createElement("div"); inner.className = "base-inner";
            for (let i = 0; i < 4; i++) {
                const pocket = document.createElement("div"); pocket.className = `base-pocket pocket-${color.toLowerCase()}`;
                const coords = BASE_POCKETS[color][i];
                pocket.dataset.row = coords[0]; pocket.dataset.col = coords[1]; pocket.id = `pocket-${color}-${i}`;
                inner.appendChild(pocket);
            }
            base.appendChild(inner); board.appendChild(base);
        }
        buildBoardGrid();

        // ==========================================
        // MATCHMAKING & ADS ROTATION
        // ==========================================
        document.getElementById("btn-play-online").addEventListener("click", () => {
            // Adsgram with Monetag Direct Link Fallback
            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: "45228" });
                AdController.show()
                    .then(() => startMatchmaking())
                    .catch(() => {
                        window.open("https://omg10.com/4/11678700", "_blank"); // Monetag Fallback
                        startMatchmaking();
                    });
            } else { 
                window.open("https://omg10.com/4/11678700", "_blank"); // Monetag Fallback
                startMatchmaking(); 
            }
        });

        document.getElementById("btn-local-play").addEventListener("click", () => {
            aiPlayers = [
                { color: "Green", name: "Bot Level 1" },
                { color: "Yellow", name: "Bot Level 2" },
                { color: "Blue", name: "Bot Level 3" }
            ];
            startGameEngine();
        });

        function startMatchmaking() {
            document.getElementById("matchmaking-modal").style.display = "flex";
            let timeLeft = 15;
            document.getElementById("search-timer").innerText = timeLeft;
            
            let timerInt = setInterval(() => {
                timeLeft--;
                document.getElementById("search-timer").innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timerInt);
                    document.getElementById("matchmaking-modal").style.display = "none";
                    // Failover to realistic AI Bots
                    aiPlayers = [
                        { color: "Green", name: "Rahul" },
                        { color: "Yellow", name: "Priya" },
                        { color: "Blue", name: "Alex" }
                    ];
                    startGameEngine();
                }
            }, 1000);
        }

        function startGameEngine() {
            gameStarted = true; matchStartTime = Date.now();
            pawns = { Red: [0,0,0,0], Green: [0,0,0,0], Yellow: [0,0,0,0], Blue: [0,0,0,0] };
            currentTurn = "Red"; diceValue = 0; diceRolled = false; standings = [];
            
            document.getElementById("lobby-view").classList.add("hidden");
            document.getElementById("game-view").classList.remove("hidden");
            renderPawns(); updateGameUI();
        }

        // ==========================================
        // GAMEPLAY MECHANICS
        // ==========================================
        document.getElementById("dice-container").addEventListener("click", () => {
            if (!gameStarted || diceRolled || currentTurn !== myColor) return;
            
            // Adsterra Popunder logic (Triggers only once on first roll)
            if(!isFirstRollAdTriggered) {
                isFirstRollAdTriggered = true;
                window.open("https://www.profitableratecpmnetwork.com/qqm7unbp9c?key=e6068fd32853ac21e39371c87bd3ec2d", "_blank");
            }

            const cube = document.getElementById("dice-cube");
            cube.className = "dice rolling";
            setTimeout(() => {
                diceValue = Math.floor(Math.random() * 6) + 1;
                diceRolled = true;
                cube.className = `dice show-${diceValue}`;
                
                if (diceValue === 6) {
                    consecutiveSixes++;
                    if (consecutiveSixes === 3) {
                        consecutiveSixes = 0; diceValue = 0; diceRolled = false;
                        passTurn(); return;
                    }
                } else consecutiveSixes = 0;

                validMoves = getValidMovesForColor(currentTurn, diceValue);
                updateGameUI();
                
                if (validMoves.length === 0) setTimeout(passTurn, 1000);
                else highlightValidPawns();
            }, 600);
        });

        function getValidMovesForColor(color, roll) {
            const list = [];
            pawns[color].forEach((steps, i) => {
                if (steps === 0 && roll === 6) list.push(i);
                else if (steps > 0 && steps + roll <= 57) list.push(i);
            });
            return list;
        }

        function highlightValidPawns() {
            validMoves.forEach(idx => {
                const pawnEl = document.getElementById(`pawn-${currentTurn}-${idx}`);
                if (pawnEl) {
                    pawnEl.classList.add("valid-move");
                    pawnEl.onclick = () => movePawnAction(idx);
                }
            });
        }

        async function movePawnAction(pawnIdx) {
            COLORS.forEach(c => { for(let i=0;i<4;i++){ const el=document.getElementById(`pawn-${c}-${i}`); if(el){el.classList.remove("valid-move"); el.onclick=null;} }});
            
            const oldSteps = pawns[currentTurn][pawnIdx];
            const newSteps = oldSteps === 0 ? 1 : oldSteps + diceValue;
            await animatePawnMovement(currentTurn, pawnIdx, diceValue);
            
            let pawnFinished = (newSteps === 57);
            if (pawnFinished && pawns[currentTurn].every(s => s === 57) && !standings.includes(currentTurn)) standings.push(currentTurn);
            
            let captured = null;
            if (newSteps >= 1 && newSteps <= 51) {
                const targetCell = getTrackCell(currentTurn, newSteps);
                if (!SAFE_CELLS.has(targetCell)) {
                    for (const oppColor of COLORS) {
                        if (oppColor === currentTurn) continue;
                        for (let i = 0; i < 4; i++) {
                            const oppSteps = pawns[oppColor][i];
                            if (oppSteps >= 1 && oppSteps <= 51 && getTrackCell(oppColor, oppSteps) === targetCell) {
                                pawns[oppColor][i] = 0; captured = { color: oppColor, idx: i }; break;
                            }
                        }
                        if (captured) break;
                    }
                }
            }
            
            const anotherTurn = (diceValue === 6 && consecutiveSixes < 3) || captured || pawnFinished;
            diceValue = 0; diceRolled = false;
            
            if (standings.includes(currentTurn)) passTurn();
            else if (anotherTurn) { consecutiveSixes = 0; updateGameUI(); if(currentTurn !== myColor) setTimeout(aiMove, 1000); }
            else { consecutiveSixes = 0; passTurn(); }
        }

        function passTurn() {
            COLORS.forEach(c => { for(let i=0;i<4;i++){ const el=document.getElementById(`pawn-${c}-${i}`); if(el){el.classList.remove("valid-move"); el.onclick=null;} }});
            
            let playable = COLORS.filter(c => !standings.includes(c));
            if (playable.length <= 1) { triggerGameOver(); return; }

            let idx = COLORS.indexOf(currentTurn);
            do { idx = (idx + 1) % 4; currentTurn = COLORS[idx]; } while (standings.includes(currentTurn));

            diceValue = 0; diceRolled = false; consecutiveSixes = 0; validMoves = [];
            updateGameUI();
            if (currentTurn !== myColor) setTimeout(aiRollDice, 1000);
        }

        // ==========================================
        // AI BOT ENGINE
        // ==========================================
        function aiRollDice() {
            if(!gameStarted) return;
            const cube = document.getElementById("dice-cube");
            cube.className = "dice rolling";
            setTimeout(() => {
                diceValue = Math.floor(Math.random() * 6) + 1;
                diceRolled = true; cube.className = `dice show-${diceValue}`;
                
                if (diceValue === 6) {
                    consecutiveSixes++;
                    if (consecutiveSixes === 3) { consecutiveSixes = 0; diceValue = 0; diceRolled = false; passTurn(); return; }
                } else consecutiveSixes = 0;

                validMoves = getValidMovesForColor(currentTurn, diceValue);
                updateGameUI();
                if (validMoves.length === 0) setTimeout(passTurn, 1000); else setTimeout(aiMove, 1000);
            }, 600);
        }

        async function aiMove() {
            let chosenIdx = validMoves[0], bestScore = -100;
            for (const idx of validMoves) {
                const steps = pawns[currentTurn][idx]; let score = steps;
                if (steps === 0) score += 50;
                const pot = steps + diceValue; if (pot === 57) score += 100;
                if (pot >= 1 && pot <= 51) {
                    const tCell = getTrackCell(currentTurn, pot);
                    if (!SAFE_CELLS.has(tCell)) {
                        COLORS.forEach(opp => { if (opp !== currentTurn) { pawns[opp].forEach(os => { if (os >= 1 && os <= 51 && getTrackCell(opp, os) === tCell) score += 200; }); }});
                    }
                }
                if (score > bestScore) { bestScore = score; chosenIdx = idx; }
            }
            await movePawnAction(chosenIdx);
        }

        // ==========================================
        // RENDER & UI UTILS
        // ==========================================
        function getTrackCell(color, steps) { return (START_TRACK_INDICES[color] + steps - 1) % 52; }
        
        function renderPawns() {
            document.querySelectorAll(".pawn-container").forEach(el => el.remove());
            const coordsMap = {};
            COLORS.forEach(color => {
                for (let i = 0; i < 4; i++) {
                    const steps = pawns[color][i]; let r = null, c = null;
                    if (steps === 0) { const crd = BASE_POCKETS[color][i]; r = crd[0]; c = crd[1]; }
                    else if (steps >= 1 && steps <= 51) { const crd = TRACK_COORDS[getTrackCell(color, steps)]; r = crd[0]; c = crd[1]; }
                    else if (steps >= 52 && steps <= 56) { const crd = HOME_CORRIDORS[color][steps - 52]; r = crd[0]; c = crd[1]; }
                    else if (steps === 57) { const crd = HOME_CENTERS[color]; r = crd[0]; c = crd[1]; }
                    if (r !== null && c !== null) { const k = `${r}_${c}`; if (!coordsMap[k]) coordsMap[k] = []; coordsMap[k].push({ color, idx: i }); }
                }
            });
            Object.keys(coordsMap).forEach(key => {
                const [r, c] = key.split("_").map(Number); const list = coordsMap[key];
                let tCell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`) || document.querySelector(`.base-pocket[data-row="${r}"][data-col="${c}"]`) || document.querySelector(".center-home");
                if (tCell) {
                    const cont = document.createElement("div"); cont.className = "pawn-container";
                    if (list.length === 2) cont.classList.add("stack-2"); else if (list.length >= 3) cont.classList.add("stack-3");
                    list.forEach(item => { const p = document.createElement("div"); p.className = `pawn pawn-${item.color.toLowerCase()}`; p.id = `pawn-${item.color}-${item.idx}`; cont.appendChild(p); });
                    tCell.appendChild(cont);
                }
            });
        }

        function animatePawnMovement(color, pawnIdx, stepsCount) {
            return new Promise(async (resolve) => {
                if (pawns[color][pawnIdx] === 0) { pawns[color][pawnIdx] = 1; renderPawns(); resolve(); return; }
                for (let s = 1; s <= stepsCount; s++) {
                    const el = document.getElementById(`pawn-${color}-${pawnIdx}`); if (el) el.classList.add('hopping');
                    await new Promise(r => setTimeout(r, 120)); pawns[color][pawnIdx]++; renderPawns();
                    await new Promise(r => setTimeout(r, 100));
                }
                resolve();
            });
        }

        function updateGameUI() {
            document.getElementById("turn-color-indicator").className = `color-dot color-${currentTurn.toLowerCase()}`;
            
            let curName = "Bot";
            if(currentTurn === myColor) curName = "You";
            else { const ai = aiPlayers.find(a => a.color === currentTurn); if(ai) curName = ai.name; }
            document.getElementById("turn-text-val").innerText = (currentTurn === myColor) ? "Your Turn!" : `${curName}'s Turn`;

            const dCont = document.getElementById("dice-container"), inst = document.getElementById("dice-instructions");
            if (currentTurn === myColor && !diceRolled) { dCont.classList.remove("disabled"); inst.innerText = "Tap Dice to Roll!"; inst.style.color = "var(--color-yellow)"; }
            else { dCont.classList.add("disabled"); inst.innerText = diceRolled ? `Rolled a ${diceValue}!` : `Waiting...`; inst.style.color = "var(--text-secondary)"; }
        }

        function quitGameToHome() { window.location.href = "index.html"; }

        // ==========================================
        // ANTI-CHEAT & REWARD LOGIC
        // ==========================================
        function triggerGameOver() {
            gameStarted = false;
            document.getElementById("game-view").classList.add("hidden");
            document.getElementById("game-over-view").classList.remove("hidden");
            
            let durationMinutes = (Date.now() - matchStartTime) / 1000 / 60;
            
            // ANTI-CHEAT: 3 Minutes Minimum Rule
            if(durationMinutes < 3) {
                document.getElementById("result-title").innerText = "SUSPICIOUS ACTIVITY";
                document.getElementById("result-desc").innerHTML = `<span style="color:#ff3355; font-weight:800;">Speed Hack Detected. Match Time: ${durationMinutes.toFixed(1)} mins.</span><br>Your account has been restricted.`;
                
                db.collection("users").doc(userId).set({ isBanned: true }, { merge: true });
                tg.showAlert("⚠️ Anti-Cheat Warning: Your account is blocked from rewards.");
            } else {
                // NEW REWARD LOGIC: 1st=100, 2nd=50, 3rd=20, 4th=10
                let reward = 10; // Default (Last place)
                if(standings[0] === myColor) reward = 100;
                else if(standings[1] === myColor) reward = 50;
                else if(standings[2] === myColor) reward = 20;

                document.getElementById("result-desc").innerHTML = `You secured <span style="color:#00d26a; font-weight:800;">+${reward} CP</span>!<br>Match Duration: ${durationMinutes.toFixed(1)} mins.`;
                
                // Add secure coins to Firebase
                if(userId !== "demo_user") {
                    db.collection("users").doc(userId).set({ cp: firebase.firestore.FieldValue.increment(reward) }, { merge: true });
                }
            }
        }
    </script>
</body>
